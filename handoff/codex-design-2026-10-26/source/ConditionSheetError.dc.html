<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비교 조건 수정 시트, 입력 오류</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}
button,a,label,select,input{touch-action:manipulation;-webkit-tap-highlight-color:rgba(54,81,232,.15)}
button,a{cursor:pointer}
:focus-visible{outline:3px solid #3651E8;outline-offset:2px}
button:hover,a:hover{filter:brightness(.94)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
a{color:#202124}a:hover{color:#3651E8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #8F9094; color: #202124; font-family: 'Gothic A1', system-ui, sans-serif; font-size: 15px; line-height: 1.6; word-break: keep-all; overflow: hidden">
  <div aria-hidden="true" style="height: 92px; flex-shrink: 0; padding: 22px 20px 0; box-sizing: border-box">
    <p style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.03em; color: #5A5B60">혜택</p>
  </div>

  <section role="dialog" aria-modal="true" aria-labelledby="ce-title" style="overscroll-behavior: contain; flex-grow: 1; min-height: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
    <div aria-hidden="true" style="display: flex; justify-content: center; padding-top: 8px">
      <div style="width: 40px; height: 5px; border-radius: 3px; background: #8E9197"></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0 20px">
      <h2 id="ce-title" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">비교 조건 수정</h2>
      <button type="button" aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #202124; border-radius: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <p style="margin: 0; padding: 0 20px; font-size: 13px; color: #55575C">모두 선택 입력이에요. 비워 두면 ‘추가 확인 필요’로 보여드려요.</p>

    <form style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 18px 20px 0">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ce-age" style="font-size: 14px; font-weight: 700">만 나이</label>
        <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 8px 0 14px; border: 2px solid #B3261E; border-radius: 12px; box-sizing: border-box">
          <input id="ce-age" name="age" autocomplete="off" type="number" inputmode="numeric" value="230" aria-invalid="true" aria-describedby="ce-age-error" style="flex-grow: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 17px; font-weight: 700; color: #202124; background: transparent">
          <span style="font-size: 15px; color: #55575C">세</span>
          <button type="button" style="min-height: 44px; padding: 0 10px; border: 0; background: transparent; color: #3651E8; font: inherit; font-size: 13px; font-weight: 700">비우기</button>
        </div>
        <p id="ce-age-error" style="margin: 0; display: flex; align-items: flex-start; gap: 6px; font-size: 13px; font-weight: 600; color: #B3261E"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>만 나이는 1부터 120 사이의 숫자로 입력해 주세요. 모르면 비워 두어도 돼요.</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ce-region" style="font-size: 14px; font-weight: 700">거주 시·도</label>
        <div style="position: relative">
          <select id="ce-region" name="residenceRegion" autocomplete="off" aria-describedby="ce-region-help" style="width: 100%; min-height: 52px; padding: 0 44px 0 14px; border: 1.5px solid #8E9197; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 17px; font-weight: 700; color: #202124; appearance: none; -webkit-appearance: none">
            <option value="">선택 안 함</option>
            <option value="seoul" selected>서울특별시</option>
            <option value="busan">부산광역시</option>
            <option value="gyeonggi">경기도</option>
          </select>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55575C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
        <p id="ce-region-help" style="margin: 0; font-size: 13px; color: #55575C">여행 출발지·목적지와 달라요. 시군구 조건은 추가 확인으로 보여드려요.</p>
      </div>

      <fieldset aria-describedby="ce-student-help" style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
        <legend style="padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 700">대학생 여부</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <label style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid #8E9197; border-radius: 12px; font-size: 14px; font-weight: 600"><input type="radio" name="ce-student" value="unset" style="margin: 0; width: 18px; height: 18px; accent-color: #3651E8">미입력</label>
          <label style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid #3651E8; background: #EEF1FD; border-radius: 12px; font-size: 14px; font-weight: 800"><input type="radio" name="ce-student" value="student" checked style="margin: 0; width: 18px; height: 18px; accent-color: #3651E8">대학생</label>
          <label style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid #8E9197; border-radius: 12px; font-size: 14px; font-weight: 600"><input type="radio" name="ce-student" value="not" style="margin: 0; width: 18px; height: 18px; accent-color: #3651E8">아님</label>
        </div>
        <p id="ce-student-help" style="margin: 0; font-size: 13px; color: #55575C">본인이 입력한 값이에요. 재학 인증이 아니며, 기관의 인정 범위는 따로 확인해요.</p>
      </fieldset>
    </form>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px calc(22px + env(safe-area-inset-bottom)); border-top: 1px solid #E3E5E9">
      <p role="status" style="margin: 0 0 2px; font-size: 13px; font-weight: 600; color: #B3261E">만 나이를 고친 뒤 다시 눌러 주세요. 지금 누르면 만 나이 칸으로 이동해요. 다른 값은 그대로예요.</p>
      <button type="button" style="min-height: 52px; border: 0; border-radius: 999px; background: #3651E8; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">내 설정에 저장하고 비교</button>
      <button type="button" style="min-height: 52px; border: 1.5px solid #202124; border-radius: 999px; background: #FFFFFF; color: #202124; font: inherit; font-size: 16px; font-weight: 700">이번 비교에만 적용</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
